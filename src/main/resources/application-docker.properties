server.port=8080
server.servlet.context-path=/user-service

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:5432/${DB_NAME:userdb}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USER:eventmaster}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Disable H2 console — not available with PostgreSQL
spring.h2.console.enabled=false

# Seed data: run after Hibernate creates the schema.
# schema-docker.sql is empty (Hibernate owns DDL); data-docker.sql inserts seed rows.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-docker.sql
spring.sql.init.data-locations=classpath:data-docker.sql
# Defer SQL script execution until after Hibernate has created the schema.
spring.jpa.defer-datasource-initialization=true

# Jackson — serialize LocalDateTime as ISO-8601 strings, not arrays
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Admin
admin.username=${ADMIN_USERNAME:admin}

# Logging
logging.level.root=INFO
logging.level.com.eventmaster=INFO
logging.file.name=logs/user-service.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
