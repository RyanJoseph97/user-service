server.port=8080
server.servlet.context-path=/user-service

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:5432/${DB_NAME:userdb}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USER:eventmaster}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Flyway owns the schema (V1__baseline.sql); Hibernate only validates that the entity
# model matches it. A drift between entities and migrations fails startup loudly.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway: migrate before Hibernate validates. baseline-on-migrate lets an existing
# pre-Flyway database (e.g. a dev volume created under the old ddl-auto=update) adopt
# the baseline cleanly; a fresh RDS instance just runs V1 from empty.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Disable H2 console — not available with PostgreSQL
spring.h2.console.enabled=false

# Schema and demo seed are both owned by Flyway (V1 schema, V2 seed users). The old
# spring.sql.init + defer-datasource-initialization flow was removed: combined with
# Flyway it creates a circular depends-on between flyway and entityManagerFactory.

# Jackson — serialize LocalDateTime as ISO-8601 strings, not arrays
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT
jwt.secret=${JWT_SECRET:?JWT_SECRET must be set}
jwt.expiration=86400000

# Admin
admin.username=${ADMIN_USERNAME:admin}

# Logging
logging.level.root=INFO
logging.level.com.eventmaster=INFO
logging.file.name=logs/user-service.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30

# Distributed Tracing
spring.zipkin.enabled=true
spring.zipkin.base-url=${SPRING_ZIPKIN_BASE_URL:http://zipkin:9411}
spring.sleuth.sampler.probability=1.0
